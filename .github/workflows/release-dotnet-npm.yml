# Reusable: cut a signed, immutable release when a package repo pushes a version tag.
#
# The git tag is the single source of truth (handbook 18 §1.1): the .NET version
# comes from MinVer, the npm version is stamped from the tag here. Builds and tests
# from public feeds only, packs both SDKs (either is optional), attaches a Sigstore
# build-provenance attestation, and publishes a GitHub Release. It does NOT push to
# nuget.org / npm — that is publish-dotnet-npm.yml, a separate gated step.
#
# Caller (in a package repo, .github/workflows/release.yml):
#   on:
#     push:
#       tags: ["v*.*.*"]
#   jobs:
#     release:
#       uses: Vev-software/.github/.github/workflows/release-dotnet-npm.yml@main
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#       with:
#         solution: AtlasContracts.slnx
#         dotnet_project: sdk/dotnet/Vev.Atlas.Contracts/Vev.Atlas.Contracts.csproj
#         ts_dir: sdk/typescript
name: release-dotnet-npm

on:
  workflow_call:
    inputs:
      solution:
        description: "Solution/.slnx to build+test (public feeds only). Required when dotnet_project is set."
        type: string
        default: ""
      dotnet_project:
        description: "Packable .NET SDK .csproj. Empty = skip the .NET package."
        type: string
        default: ""
      ts_dir:
        description: "TypeScript SDK directory (contains package.json). Empty = skip the npm package."
        type: string
        default: ""
      dotnet_test:
        description: "Run dotnet test as the release gate."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: signed release
    # Never run from a fork: releases and provenance must come from the canonical repo.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # keyless Sigstore signing for the attestation
      attestations: write # record the build-provenance attestation
    steps:
      # fetch-depth: 0 gives MinVer the full history + tags it needs to derive the version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Setup .NET (pinned by global.json)
        if: ${{ inputs.dotnet_project != '' }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        if: ${{ inputs.ts_dir != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Public feeds only, and the full conformance gate — a release must pass CI.
      - name: Build + test (public feeds only)
        if: ${{ inputs.dotnet_project != '' && inputs.solution != '' }}
        run: |
          dotnet restore "${{ inputs.solution }}"
          dotnet build "${{ inputs.solution }}" -c Release --no-restore
          if [ "${{ inputs.dotnet_test }}" = "true" ]; then
            dotnet test "${{ inputs.solution }}" -c Release --no-build
          fi

      # No --no-build: MinVer stamps the version during this build (the tag is the source of truth).
      - name: Pack .NET SDK
        if: ${{ inputs.dotnet_project != '' }}
        run: dotnet pack "${{ inputs.dotnet_project }}" -c Release -o artifacts

      # The npm version is stamped from the tag (vX.Y.Z → X.Y.Z) so it always matches
      # the .NET package. `npm pack` runs prepack, so the tarball ships any schemas.
      - name: Pack TypeScript SDK
        if: ${{ inputs.ts_dir != '' }}
        working-directory: ${{ inputs.ts_dir }}
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm install
          npm run build
          npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      # Sigstore keyless provenance for every release artifact.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --verify-tag --generate-notes
