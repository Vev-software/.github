# Reusable: publish the SDK packages to the public registries for a released tag.
#
# Auth is OIDC "Trusted Publishing" — NO long-lived API keys. The caller passes the
# `tag` cut by release-dotnet-npm.yml; each job checks out that tag, so the version
# is derived from it (MinVer for .NET, `npm version` for npm) and the publish matches
# exactly the tagged commit. Gated by the `release` environment in the caller repo,
# so a publish is a deliberate maintainer action.
#
# One-time setup per package (all on the REGISTRY, not on GitHub):
#   nuget.org — Account → Trusted Publishing: repo owner=Vev-software, repo=<name>,
#     workflow file=publish.yml, environment=release. Set repo variable NUGET_USER to
#     the policy CREATOR's personal nuget.org username (NOT the org / package-owner
#     name — the token exchange resolves by the creator account).
#   npm — package page → Settings → Trusted Publisher → GitHub Actions:
#     org=Vev-software, repo=<name>, workflow=publish.yml, environment=release.
#     A trusted publisher attaches to an EXISTING package, so the very first publish
#     of a brand-new package needs a one-time manual bootstrap to create it.
#
# ⚠️ DELEGATING EITHER JOB via `uses:` DOES NOT WORK for org-owned packages. Trusted
#   Publishing matches on the OIDC `job_workflow_ref` claim, and when a job runs inside
#   THIS reusable workflow that claim points at Vev-software/.github — not the caller —
#   so no per-repo policy matches. This bites BOTH registries:
#     * nuget — token exchange fails with HTTP 401 (`No matching trust policy owned by
#       user …`); upstream bug NuGet/login#6, https://github.com/NuGet/login/issues/6.
#     * npm — same class of failure, observed empirically: the delegated npm publish
#       returns E404 (npm's "unauthorized" for a scoped package) because the per-repo
#       npm Trusted Publisher policy is registered as workflow=publish.yml, which the
#       reusable ref does not match. (An earlier version of this note claimed "npm is
#       unaffected" — that is WRONG; it fails for the same reason as nuget.)
#   Therefore callers must INLINE BOTH jobs in their own publish.yml (so
#   `job_workflow_ref` = <repo>/publish.yml, matching a per-repo policy with
#   Repository=<repo>). This file is the canonical SOURCE to mirror those steps from,
#   not a workflow to delegate to. Revert each job to `uses:` once its ref-mismatch
#   root cause is fixed (nuget: NuGet/login#6; npm: re-register the policy against the
#   reusable ref).
#
# Caller (in a package repo, .github/workflows/publish.yml) — inline BOTH jobs:
#   jobs:
#     nuget:            # INLINED; mirror this file's publish-nuget job steps
#       if: ${{ !github.event.repository.fork && inputs.publish_nuget }}
#       runs-on: ubuntu-latest
#       environment: release
#       permissions: { contents: read, id-token: write }
#       steps: [ checkout (ref=tag, fetch-depth:0), setup-dotnet (global.json),
#                build+test, pack, NuGet/login@v1 (user: ${{ vars.NUGET_USER }}),
#                dotnet nuget push --skip-duplicate ]
#     npm:              # INLINED; mirror this file's publish-npm job steps
#       if: ${{ !github.event.repository.fork && inputs.publish_npm }}
#       runs-on: ubuntu-latest
#       environment: release
#       permissions: { contents: read, id-token: write }
#       steps: [ checkout (ref=tag), setup-node (node 22, registry-url npmjs),
#                update npm, npm version "${TAG#v}" + install + build,
#                npm publish --access public ]
#   Reference implementations: Vev-software/fabric#31, Vev-software/atlas-contracts#26.
name: publish-dotnet-npm

on:
  workflow_call:
    inputs:
      tag:
        description: "Released tag to publish (e.g. v0.2.0). Must already exist (cut by release)."
        type: string
        required: true
      solution:
        description: "Solution/.slnx to build+test before publishing the .NET package."
        type: string
        default: ""
      dotnet_project:
        description: "Packable .NET SDK .csproj. Empty = no nuget publish."
        type: string
        default: ""
      ts_dir:
        description: "TypeScript SDK directory. Empty = no npm publish."
        type: string
        default: ""
      publish_nuget:
        description: "Publish the .NET package to nuget.org."
        type: boolean
        default: true
      publish_npm:
        description: "Publish the npm package."
        type: boolean
        default: true
      environment:
        description: "Deployment environment gating the publish (must exist in the caller repo)."
        type: string
        default: "release"

permissions:
  contents: read

jobs:
  publish-nuget:
    name: publish · nuget.org
    if: ${{ !github.event.repository.fork && inputs.publish_nuget && inputs.dotnet_project != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC for NuGet Trusted Publishing — no API key
    steps:
      # Check out the released tag with full history so MinVer derives that version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build + test (public feeds only)
        if: ${{ inputs.solution != '' }}
        run: |
          dotnet restore "${{ inputs.solution }}"
          dotnet build "${{ inputs.solution }}" -c Release --no-restore
          dotnet test "${{ inputs.solution }}" -c Release --no-build

      # No --no-build: MinVer stamps the version (from the checked-out tag) during pack.
      - name: Pack
        run: dotnet pack "${{ inputs.dotnet_project }}" -c Release -o artifacts

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key. Needs a
      # trusted-publishing policy on nuget.org and the repo variable NUGET_USER.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish-npm:
    name: publish · npm
    if: ${{ !github.event.repository.fork && inputs.publish_npm && inputs.ts_dir != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing + build provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (tokenless OIDC) needs a recent npm (>= 11.5.1).
      - name: Update npm
        run: npm install -g npm@latest

      # Stamp the npm version from the tag (vX.Y.Z → X.Y.Z) — same source as .NET.
      - name: Build
        working-directory: ${{ inputs.ts_dir }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm install
          npm run build

      # No NODE_AUTH_TOKEN: OIDC Trusted Publishing supplies the credential and
      # npm attaches a signed provenance statement automatically.
      - name: Publish to npm (Trusted Publishing)
        working-directory: ${{ inputs.ts_dir }}
        run: npm publish --access public
